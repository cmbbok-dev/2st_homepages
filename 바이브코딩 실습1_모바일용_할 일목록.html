<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 목록</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f2f4f7;
      display: flex;
      justify-content: center;
    }

  
    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input, select {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    input { flex: 1; }

    button {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: #4caf50;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { background: #43a047; }

    ul { list-style: none; padding: 0; }

    li {
      background: white;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: 0.2s;
    }

    li.completed {
      text-decoration: line-through;
      color: #aaa;
      background: #e9ecef;
      opacity: 0.7;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .priority-low { color: #4caf50; }
    .priority-mid { color: #ff9800; }
    .priority-high { color: #e53935; }

    .actions button {
      margin-left: 6px;
      background: #ddd;
      color: #333;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .actions .delete {
      background: #e74c3c;
      color: white;
      font-size: 12px;
      padding: 6px 8px;
    }
  </style>
</head>
<body>
  <header style="width:100%;max-width:420px;padding:16px 16px 0;margin:0 auto;">
    <h1 style="margin:0;text-align:center;font-size:22px;">📋 할 일 관리</h1>
    <p style="text-align:center;color:#666;font-size:14px;margin-top:6px;">오늘 할 일을 정리해보세요</p>
  </header>

  <div class="container">
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="할 일을 입력하세요" />
      <select id="priority">
        <option value="low">낮음</option>
        <option value="mid">보통</option>
        <option value="high">높음</option>
      </select>
      <button id="addBtn">추가</button>
    </div>

    <ul id="todoList"></ul>
  </div>

  <footer style="width:100%;max-width:420px;margin:20px auto 30px;padding:10px;text-align:center;color:#888;font-size:13px;">
    © 2026 Todo App · 간단한 할 일 관리 웹앱
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('todoInput');
      const list = document.getElementById('todoList');
      const addBtn = document.getElementById('addBtn');
      const priority = document.getElementById('priority');

      let todos = JSON.parse(localStorage.getItem('todos') || '[]');

      function save() {
        localStorage.setItem('todos', JSON.stringify(todos));
      }

      function render() {
        list.innerHTML = '';
        todos.forEach((todo, index) => {
          const li = document.createElement('li');
          if (todo.completed) li.classList.add('completed');

          const row = document.createElement('div');
          row.className = 'row';

          const text = document.createElement('span');
          text.textContent = todo.text;

          const pr = document.createElement('span');
          pr.textContent = todo.priority;
          pr.className = 'priority-' + todo.priority;

          row.appendChild(text);
          row.appendChild(pr);

          const actions = document.createElement('div');
          actions.className = 'actions';

          const editBtn = document.createElement('button');
          editBtn.textContent = '수정';
          editBtn.onclick = (e) => {
            e.stopPropagation();
            const newText = prompt('수정할 내용', todo.text);
            if (newText) {
              todo.text = newText;
              save();
              render();
            }
          };

          const delBtn = document.createElement('button');
          delBtn.textContent = '삭제';
          delBtn.className = 'delete';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            todos.splice(index, 1);
            save();
            render();
          };

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);

          li.appendChild(row);
          li.appendChild(actions);

          li.addEventListener('click', () => {
            todo.completed = !todo.completed;
            save();
            render();
          });

          list.appendChild(li);
        });
      }

      function addTodo() {
        const text = input.value.trim();
        if (!text) return;

        todos.push({ text, priority: priority.value, completed: false });
        input.value = '';
        save();
        render();
      }

      addBtn.addEventListener('click', addTodo);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

      render();
    });
  </script>
</body>
</html>
